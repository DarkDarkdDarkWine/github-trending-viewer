<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Trending Viewer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🔥 GitHub 热门项目</h1>
            <p class="subtitle">探索 GitHub 上最热门的开源项目</p>
        </header>

        <nav class="tabs">
            <button class="tab-btn active" data-tab="trending">热门趋势</button>
            <button class="tab-btn" data-tab="starred">我的Star动态</button>
        </nav>

        <div id="tab-trending" class="tab-content active">
            <div class="filters">
                <div class="filter-group">
                    <label for="timeRange">时间范围：</label>
                    <select id="timeRange">
                        <option value="daily">今天</option>
                        <option value="weekly" selected>本周</option>
                        <option value="monthly">本月</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="language">编程语言：</label>
                    <select id="language">
                        <option value="">所有语言</option>
                    </select>
                </div>

                <button id="refreshBtn" class="refresh-btn">🔄 刷新</button>
            </div>

            <div id="loading" class="loading hidden">
                <div class="spinner"></div>
                <p>正在加载热门项目...</p>
            </div>

            <div id="error" class="error hidden"></div>

            <div id="stats" class="stats hidden">
                找到 <span id="repoCount">0</span> 个项目
            </div>

            <div id="repositories" class="repositories"></div>
        </div>

        <div id="tab-starred" class="tab-content">
            <div id="starred-loading" class="loading hidden">
                <div class="spinner"></div>
                <p>正在加载Star动态...</p>
            </div>
            <div id="starred-activity" class="activity-timeline"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
