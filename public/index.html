<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Trending Viewer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🔥 GitHub 热门项目</h1>
            <p class="subtitle">探索 GitHub 上最热门的开源项目</p>
        </header>

        <nav class="tabs">
            <button class="tab-btn active" data-tab="trending">热门趋势</button>
            <button class="tab-btn" data-tab="starred">我的Star动态</button>
            <button class="tab-btn" data-tab="reports">趋势报告</button>
            <button class="tab-btn" data-tab="settings">AI 设置</button>
        </nav>

        <div id="tab-trending" class="tab-content active">
            <div class="filters">
                <div class="filter-group">
                    <label for="timeRange">时间范围：</label>
                    <select id="timeRange">
                        <option value="daily">今天</option>
                        <option value="weekly" selected>本周</option>
                        <option value="monthly">本月</option>
                    </select>
                </div>

                <button id="refreshBtn" class="refresh-btn">🔄 刷新</button>
            </div>

            <div id="loading" class="loading hidden">
                <div class="spinner"></div>
                <p>正在加载热门项目...</p>
            </div>

            <div id="error" class="error hidden"></div>

            <div id="stats" class="stats hidden">
                找到 <span id="repoCount">0</span> 个项目
            </div>

            <div id="repositories" class="repositories"></div>
        </div>

        <div id="tab-starred" class="tab-content">
            <div id="starred-loading" class="loading hidden">
                <div class="spinner"></div>
                <p>正在加载Star动态...</p>
            </div>
            <div id="starred-activity" class="activity-timeline"></div>
        </div>

        <div id="tab-reports" class="tab-content">
            <div id="reports-loading" class="loading hidden">
                <div class="spinner"></div>
                <p>正在加载报告...</p>
            </div>
            <div id="reports-list"></div>
            <div id="report-detail" class="hidden">
                <button class="back-btn" id="reportBackBtn">← 返回列表</button>
                <div id="report-detail-content"></div>
            </div>
        </div>
        <div id="tab-settings" class="tab-content">
            <div class="settings-container">
                <div class="settings-header">
                    <h2 class="settings-title">AI API 供应商配置</h2>
                    <p class="settings-desc">配置用于翻译和报告生成的 AI API</p>
                </div>
                <div id="task-assign-section" class="task-assign-section">
                    <h3 class="task-assign-title">任务分配</h3>
                    <div class="task-assign-rows">
                        <div class="task-assign-row">
                            <label>翻译</label>
                            <select id="assign-translate"><option value="">自动选择</option></select>
                        </div>
                        <div class="task-assign-row">
                            <label>报告生成</label>
                            <select id="assign-report"><option value="">自动选择</option></select>
                        </div>
                        <button class="btn-sm btn-save-assign" id="saveTaskAssign">保存分配</button>
                    </div>
                    <div id="task-assign-result" class="provider-test-result"></div>
                </div>
                <div id="providers-list" class="providers-list"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
