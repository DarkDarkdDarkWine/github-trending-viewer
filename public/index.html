<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>开源趋势工作台 · GitHub Trending Radar</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div class="container">
        <header class="app-header">
            <div class="brand-lockup">
                <div class="brand-mark" aria-hidden="true">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
                <div>
                    <p class="eyebrow">GitHub Trending Radar</p>
                    <h1>开源趋势工作台</h1>
                    <p class="subtitle">追踪热门仓库、排名变化、Star 资产与 AI 推荐信号。</p>
                </div>
            </div>
            <div class="header-status" aria-label="能力状态">
                <span>趋势抓取</span>
                <span>Star 监控</span>
                <span>AI 翻译</span>
            </div>
        </header>

        <nav class="tabs">
            <button class="tab-btn active" data-tab="trending">热门趋势</button>
            <button class="tab-btn" data-tab="starred">我的 Star</button>
            <button class="tab-btn" data-tab="reports">趋势报告</button>
            <button class="tab-btn" data-tab="settings">AI 设置</button>
        </nav>

        <div id="tab-trending" class="tab-content active">
            <section class="trend-console" aria-label="趋势控制台">
                <div class="console-copy">
                    <span class="section-kicker">Live feed</span>
                    <h2>热门趋势</h2>
                    <p>按时间窗口查看仓库热度，并把翻译、收藏状态和推荐分直接叠到列表里。</p>
                </div>
                <div class="filters">
                    <div class="filter-group">
                        <label for="timeRange">时间范围</label>
                        <select id="timeRange">
                            <option value="daily" selected>今天</option>
                            <option value="weekly">本周</option>
                            <option value="monthly">本月</option>
                        </select>
                    </div>

                    <button id="refreshBtn" class="refresh-btn">刷新</button>
                    <button id="starredFilterBtn" class="filter-btn" title="只看我 Star 过的项目">只看 Star</button>
                    <button id="recommendedSortBtn" class="filter-btn recommended" title="按 AI 推荐分排序">推荐排序</button>
                </div>
            </section>

            <section class="inspector-bar" aria-label="列表筛选与排序">
                <label class="search-box" for="repoSearch">
                    <span>搜索</span>
                    <input id="repoSearch" type="search" placeholder="仓库 / 作者 / 语言 / 描述" autocomplete="off">
                </label>
                <div class="filter-group">
                    <label for="sortMode">排序</label>
                    <select id="sortMode">
                        <option value="rank" selected>默认排名</option>
                        <option value="period-stars">新增 Star</option>
                        <option value="stars">总 Star</option>
                        <option value="forks">Fork 数</option>
                        <option value="recommendation">推荐分</option>
                    </select>
                </div>
                <button id="clearFiltersBtn" class="ghost-btn">清除筛选</button>
                <div id="activeFilterSummary" class="active-filter-summary" aria-live="polite"></div>
            </section>

            <div id="loading" class="loading hidden">
                <div class="spinner"></div>
                <p>正在同步趋势数据...</p>
            </div>

            <div id="error" class="error hidden"></div>

            <div id="stats" class="stats hidden">
                <span class="stats-label">当前列表</span>
                <strong><span id="repoCount">0</span></strong>
                <span>个项目</span>
            </div>

            <div id="repositories" class="repositories"></div>
        </div>

        <div id="tab-starred" class="tab-content">
            <div id="starred-loading" class="loading hidden">
                <div class="spinner"></div>
                <p>正在加载 Star 仪表盘...</p>
            </div>
            <div id="starred-summary" class="star-summary hidden"></div>
            <div id="starred-dashboard" class="star-dashboard"></div>
        </div>

        <div id="tab-reports" class="tab-content">
            <div id="reports-loading" class="loading hidden">
                <div class="spinner"></div>
                <p>正在加载报告...</p>
            </div>
            <div id="reports-list"></div>
            <div id="report-detail" class="hidden">
                <button class="back-btn" id="reportBackBtn">← 返回列表</button>
                <div id="report-detail-content"></div>
            </div>
        </div>
        <div id="tab-settings" class="tab-content">
            <div class="settings-container">
                <div class="settings-header">
                    <h2 class="settings-title">AI API 供应商配置</h2>
                    <p class="settings-desc">配置用于翻译和报告生成的 AI API</p>
                </div>
                <div id="task-assign-section" class="task-assign-section">
                    <h3 class="task-assign-title">任务分配</h3>
                    <div class="task-assign-rows">
                        <div class="task-assign-row">
                            <label>翻译</label>
                            <select id="assign-translate"><option value="">自动选择</option></select>
                        </div>
                        <div class="task-assign-row">
                            <label>报告生成</label>
                            <select id="assign-report"><option value="">自动选择</option></select>
                        </div>
                        <div class="task-assign-row">
                            <label>推荐排序</label>
                            <select id="assign-recommendation"><option value="">自动选择</option></select>
                        </div>
                        <button class="btn-sm btn-save-assign" id="saveTaskAssign">保存分配</button>
                    </div>
                    <div id="task-assign-result" class="provider-test-result"></div>
                </div>
                <div id="providers-list" class="providers-list"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script type="module" src="/js/main.js?v=20260606-interactions"></script>
</body>
</html>
