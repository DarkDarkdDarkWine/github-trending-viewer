services:
  github-trending:
    build: .
    container_name: github-trending-viewer
    restart: unless-stopped
    ports:
      - "3003:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/trending?since=daily"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - github-trending-network

networks:
  github-trending-network:
    driver: bridge
